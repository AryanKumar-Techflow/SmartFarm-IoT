<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Eggplant Body Gradient -->
    <linearGradient id="eggplantBodyGrad" x1="20%" y1="15%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="45%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <!-- Calyx Green Gradient -->
    <linearGradient id="eggplantCalyxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <!-- Shadow -->
    <radialGradient id="eggplantGroundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B0764" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3B0764" stop-opacity="0"/>
    </radialGradient>
    <filter id="eggplantShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#581C87" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="182" rx="55" ry="11" fill="url(#eggplantGroundShadow)"/>

  <!-- Plump Cute Pear-shaped Eggplant Body -->
  <path d="M85 64 
           C68 82 50 115 54 142 
           C58 168 85 178 106 178 
           C130 178 152 165 154 138 
           C156 112 136 80 118 64 
           C105 52 94 52 85 64 Z"
        fill="url(#eggplantBodyGrad)"
        stroke="#581C87"
        stroke-width="3.5"
        filter="url(#eggplantShadow)"/>

  <!-- Glossy Shiny Highlights on Skin -->
  <path d="M72 90 C66 108 64 128 68 142" stroke="#E9D5FF" stroke-width="4.5" stroke-linecap="round" opacity="0.45"/>
  <circle cx="70" cy="84" r="3" fill="#E9D5FF" opacity="0.6"/>

  <!-- Green Calyx Cap (Cute Hat) and Stem on Top -->
  <g>
    <!-- Stem -->
    <path d="M102 46 C102 32 106 20 116 12" stroke="#059669" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="116" cy="12" rx="3.5" ry="3" fill="#34D399"/>
    <!-- Calyx sepals / leaves spreading over head -->
    <path d="M72 58 C80 68 86 64 88 56 C92 70 102 68 104 56 C108 70 116 68 122 56 C126 66 136 64 134 52 C126 44 115 42 102 42 C88 42 78 46 72 58 Z"
          fill="url(#eggplantCalyxGrad)"
          stroke="#065F46"
          stroke-width="2.5"/>
  </g>

  <!-- Blushing Pastel Pink Cheeks -->
  <ellipse cx="78" cy="126" rx="9.5" ry="6.5" fill="#F472B6" opacity="0.7"/>
  <ellipse cx="130" cy="124" rx="9.5" ry="6.5" fill="#F472B6" opacity="0.7"/>

  <!-- Kawaii Sparkling Eyes -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="85" cy="110" rx="6.5" ry="8" fill="#1C1917"/>
    <circle cx="83" cy="107" r="2.8" fill="#FFFFFF"/>
    <circle cx="87.5" cy="112" r="1.4" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <ellipse cx="122" cy="108" rx="6.5" ry="8" fill="#1C1917"/>
    <circle cx="120" cy="105" r="2.8" fill="#FFFFFF"/>
    <circle cx="124.5" cy="110" r="1.4" fill="#FFFFFF"/>
  </g>

  <!-- Happy Sweet Mouth -->
  <path d="M96 122 C96 133 111 133 111 122" stroke="#1C1917" stroke-width="3" stroke-linecap="round" fill="#DC2626"/>
  <path d="M99 126 C101 130 106 130 108 126" fill="#F87171"/>

  <!-- Tiny Cheerful Wave / Hands -->
  <ellipse cx="50" cy="128" rx="5" ry="6" fill="#9333EA" stroke="#581C87" stroke-width="2"/>
  <ellipse cx="156" cy="122" rx="5" ry="6" fill="#9333EA" stroke="#581C87" stroke-width="2"/>

  <!-- Little Sparkle -->
  <path d="M162 70 Q165 75 170 76 Q165 78 162 82 Q159 78 154 76 Q159 75 162 70 Z" fill="#FDE047" opacity="0.9"/>
</svg>