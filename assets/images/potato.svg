<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Potato Body Gradient -->
    <linearGradient id="potatoBodyGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FCD399"/>
      <stop offset="45%" stop-color="#E8A868"/>
      <stop offset="100%" stop-color="#C9823E"/>
    </linearGradient>
    <!-- Sprout Leaves Gradient -->
    <linearGradient id="potatoSproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <!-- Ground Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0"/>
    </radialGradient>
    <filter id="potatoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#854D0E" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Soft Ground Shadow -->
  <ellipse cx="100" cy="178" rx="60" ry="12" fill="url(#groundShadow)"/>

  <!-- Tiny Baby Green Sprout on Top of Head -->
  <g>
    <!-- Sprout stem -->
    <path d="M100 56 C100 42 98 34 94 25" stroke="#10B981" stroke-width="5" stroke-linecap="round"/>
    <!-- Left baby leaf -->
    <path d="M96 32 C82 28 75 16 78 8 C92 8 98 22 96 32 Z" fill="url(#potatoSproutGrad)"/>
    <path d="M86 20 C90 24 94 28 96 32" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Right baby leaf -->
    <path d="M96 28 C108 22 120 18 124 10 C124 22 110 28 96 28 Z" fill="url(#potatoSproutGrad)"/>
    <path d="M110 20 C105 24 100 26 96 28" stroke="#047857" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Cute little dewdrop on leaf -->
    <circle cx="82" cy="12" r="2.5" fill="#E0F2FE" opacity="0.9"/>
  </g>

  <!-- Chubby Chubby Potato Body -->
  <path d="M60 75 
           C42 92 40 125 55 148 
           C70 170 125 174 148 152 
           C166 132 165 96 150 74 
           C134 52 82 54 60 75 Z"
        fill="url(#potatoBodyGrad)"
        stroke="#B45309"
        stroke-width="3.5"
        filter="url(#potatoShadow)"/>

  <!-- Cute Potato Freckles & Spots -->
  <ellipse cx="64" cy="98" rx="4" ry="2.5" fill="#92400E" opacity="0.25" transform="rotate(-15 64 98)"/>
  <ellipse cx="58" cy="130" rx="5" ry="3" fill="#92400E" opacity="0.2" transform="rotate(10 58 130)"/>
  <ellipse cx="146" cy="138" rx="4.5" ry="2.5" fill="#92400E" opacity="0.25" transform="rotate(-20 146 138)"/>
  <ellipse cx="152" cy="88" rx="4" ry="2" fill="#92400E" opacity="0.2" transform="rotate(25 152 88)"/>
  <ellipse cx="118" cy="64" rx="3.5" ry="2" fill="#92400E" opacity="0.2" transform="rotate(5 118 64)"/>

  <!-- Blushing Pastel Pink Cheeks -->
  <ellipse cx="72" cy="118" rx="10" ry="6.5" fill="#F472B6" opacity="0.6"/>
  <ellipse cx="132" cy="116" rx="10" ry="6.5" fill="#F472B6" opacity="0.6"/>

  <!-- Kawaii Sparkling Eyes -->
  <g>
    <!-- Left Eye -->
    <ellipse cx="80" cy="102" rx="7" ry="8.5" fill="#1C1917"/>
    <circle cx="78" cy="99" r="3" fill="#FFFFFF"/>
    <circle cx="83" cy="104.5" r="1.5" fill="#FFFFFF"/>
    <!-- Right Eye -->
    <ellipse cx="124" cy="100" rx="7" ry="8.5" fill="#1C1917"/>
    <circle cx="122" cy="97" r="3" fill="#FFFFFF"/>
    <circle cx="127" cy="102.5" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Cute Sweet Smiling Mouth with Rosy Tongue -->
  <path d="M94 113 C94 125 110 125 110 113" stroke="#1C1917" stroke-width="3" stroke-linecap="round" fill="#DC2626"/>
  <path d="M97 117 C99 121 105 121 107 117" fill="#F87171"/>

  <!-- Tiny Happy Little Hands -->
  <ellipse cx="48" cy="120" rx="6" ry="7" fill="#E8A868" stroke="#B45309" stroke-width="2.5"/>
  <ellipse cx="156" cy="116" rx="6" ry="7" fill="#E8A868" stroke="#B45309" stroke-width="2.5"/>

  <!-- Sparkle of Vitality -->
  <path d="M165 62 Q168 67 174 68 Q168 70 165 75 Q162 70 156 68 Q162 67 165 62 Z" fill="#FDE047" opacity="0.9"/>
</svg>